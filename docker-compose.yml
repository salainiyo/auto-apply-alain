services:
  postgres:
    image: postgres:16
    container_name: auto-apply-db
    environment:
      POSTGRES_USER: alain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changepassword}
      POSTGRES_DB: auto_apply
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alain -d auto_apply"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auto-apply-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: auto-apply-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alain:${POSTGRES_PASSWORD:-changepassword}@postgres:5432/auto_apply
      DATABASE_SYNC_URL: postgresql://alain:${POSTGRES_PASSWORD:-changepassword}@postgres:5432/auto_apply
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_URL: redis://redis:6379/1
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery-worker:
    build: ./backend
    container_name: auto-apply-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alain:${POSTGRES_PASSWORD:-changepassword}@postgres:5432/auto_apply
      DATABASE_SYNC_URL: postgresql://alain:${POSTGRES_PASSWORD:-changepassword}@postgres:5432/auto_apply
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info

  celery-beat:
    build: ./backend
    container_name: auto-apply-beat
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alain:${POSTGRES_PASSWORD:-changepassword}@postgres:5432/auto_apply
      DATABASE_SYNC_URL: postgresql://alain:${POSTGRES_PASSWORD:-changepassword}@postgres:5432/auto_apply
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    container_name: auto-apply-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
